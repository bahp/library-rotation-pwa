    <style id="lr-critical-splash">
      :root {
        --splash-bg: #F7F5EE;
        --splash-fg: #15241F;
        --splash-muted: #55665F;
        --splash-emblem-bg: #1E322C;
        --splash-emblem-border: #3B544B;
        --splash-emblem-shadow: 0 12px 26px -10px rgba(20, 35, 33, 0.28);
        --splash-orbit-a: #D0AD55;
        --splash-orbit-b: #A8B59A;
        --splash-page: #FFFCF5;
        --splash-spine: #1E322C;
        --splash-lines: #B38B43;
      }
      html, body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;

        color: var(--splash-fg);
      }
      html[data-theme="sunlit-cream"] {

        --splash-emblem-border: #6B94BF;

      }
      html[data-theme="sage-green"] {

        --splash-emblem-border: #87A175;
        --splash-spine: #4B683B;
      }
      html[data-theme="blush-pink"] {

        --splash-muted: #765B64;
        --splash-emblem-bg: #9E4357;

        --splash-spine: #9E4357;
      }
      html[data-theme="classic-light"] {

        --splash-emblem-border: #2A3B32;
        --splash-emblem-shadow: 0 14px 28px -10px rgba(0, 0, 0, 0.55);

        --splash-emblem-border: #2B4562;

        --splash-emblem-border: #4A3828;
        --splash-orbit-a: #E8BC78;
        --splash-orbit-b: #D49A50;

        --splash-fg: #F3E7F0;
        --splash-muted: #B29BAE;

        --splash-emblem-border: #4B3354;

        --splash-fg: #EDF1F3;
        --splash-muted: #9BA5AE;
        --splash-emblem-bg: #242C33;
        --splash-emblem-border: #3A4652;
        --splash-orbit-a: #8CABB2;
        --splash-orbit-b: #39B8C3;
        --splash-spine: #242C33;
      }
      html.dark[data-theme="forest-library"] {
        --splash-bg: #142321;
        --splash-fg: #F0E7D5;
        --splash-muted: #B5AA96;
        --splash-emblem-bg: #1C2D29;
        --splash-emblem-border: #3B4436;
        --splash-spine: #244B40;
      }
      html.dark[data-theme="midnight-library"] {
        --splash-bg: #0F100F;
        --splash-fg: #F4F2EC;
        --splash-muted: #A9A69C;
        --splash-emblem-bg: #181918;
        --splash-emblem-border: #333532;
        --splash-orbit-a: #E0B654;
        --splash-spine: #181918;
      }
      html.dark[data-theme="hylle-editorial"] {
        --splash-bg: #0B0D0C;
        --splash-fg: #F3EFE6;
        --splash-muted: #9C9688;
        --splash-emblem-bg: #141513;
        --splash-emblem-border: #282924;
        --splash-orbit-a: #D2B35B;
        --splash-spine: #141513;
      }
      .lr-boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
      }
      .lr-boot-emblem-wrap {
        position: relative;
        width: 4.25rem;
        height: 4.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lr-boot-emblem {
        width: 4rem;
        height: 4rem;
        border-radius: 0.875rem;
        background-color: var(--splash-emblem-bg);
        border: 1px solid var(--splash-emblem-border);
        box-shadow: var(--splash-emblem-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: lr-splash-breathe 2.1s ease-in-out infinite;
      }
      .lr-boot-orbit {
        transform-origin: 16px 16px;
        animation: lr-splash-spin 5.5s linear infinite;
      }
      .lr-boot-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0.25rem 0 0;
      }
      .lr-boot-sub {
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        font-size: 0.75rem;
        color: var(--splash-muted);
        margin: 0;
      }
      @keyframes lr-splash-breathe {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-4px) scale(1.015);
        }
      }
      @keyframes lr-splash-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lr-boot-emblem,
        .lr-boot-orbit {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        // 1. Guard against third-party browser extensions (e.g. request interceptors)
        // throwing "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var fetchDesc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (fetchDesc && fetchDesc.configurable && fetchDesc.get && !fetchDesc.set) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = String((event && event.filename) || '');
            var stack = String((event && event.error && event.error.stack) || '');
            if (
              src.indexOf('chrome-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        // 2. Apply saved or system color theme, themePreset, AND exact top-bar theme-color before first paint (zero FOUC)
        var LIGHT_PRESETS = {
          'darker-teal': { bg: '#F7F5EE', emblem: '#1E322C' },
          'sunlit-cream': { bg: '#F7F1E7', emblem: '#9E572C' },
          'classic-teal': { bg: '#F8F5EE', emblem: '#115953' },
          'antique-paper': { bg: '#F5F0E5', emblem: '#244B40' },
          'sky-blue': { bg: '#F0F5FA', emblem: '#2F6CA8' },
          'sage-green': { bg: '#F1F3EA', emblem: '#4B683B' },
          'blush-pink': { bg: '#FBF0EF', emblem: '#9E4357' },
          'classic-light': { bg: '#F5F5F3', emblem: '#353B40' },
        };
        var DARK_PRESETS = {
          'forest-brass': { bg: '#101713', emblem: '#19251F' },
          'hylle-editorial': { bg: '#0B0D0C', emblem: '#141513' },
          'midnight-ink': { bg: '#0B1420', emblem: '#152538' },
          'warm-library': { bg: '#17120E', emblem: '#292017' },
          'plum-noir': { bg: '#19121C', emblem: '#2B1D30' },
          'slate-minimal': { bg: '#15191D', emblem: '#242C33' },
          'forest-library': { bg: '#142321', emblem: '#1C2D29' },
          'midnight-library': { bg: '#0F100F', emblem: '#181918' },
        };
        var isDark = false;
        var activePreset = 'darker-teal';
        var canvasHex = '#F7F5EE';
        var emblemHex = '#1E322C';
        try {
          var saved = localStorage.getItem('lr_theme_pref') || 'light';
          var savedPreset = localStorage.getItem('lr_theme_preset') || '';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            activePreset = DARK_PRESETS[savedPreset] ? savedPreset : 'forest-brass';
            canvasHex = DARK_PRESETS[activePreset].bg;
            emblemHex = DARK_PRESETS[activePreset].emblem;
          } else {
            document.documentElement.classList.remove('dark');
            activePreset = LIGHT_PRESETS[savedPreset] ? savedPreset : 'darker-teal';
            canvasHex = LIGHT_PRESETS[activePreset].bg;
            emblemHex = LIGHT_PRESETS[activePreset].emblem;
          }
          document.documentElement.setAttribute('data-theme', activePreset);
          var themeMeta = document.getElementById('lr-theme-color');
          if (themeMeta) {
            themeMeta.setAttribute('content', canvasHex);
          }
        } catch (_) {}

        // 3. Synthesize a crisp iOS startup image matching the active theme preset so Home Screen launch never flashes
        try {
          if (/iphone|ipad|ipod/i.test(navigator.userAgent || '')) {
            var dpr = Math.min(window.devicePixelRatio || 2, 3);
            var w = Math.round((window.screen.width || 414) * dpr);
            var h = Math.round((window.screen.height || 896) * dpr);
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.fillStyle = canvasHex;
              ctx.fillRect(0, 0, w, h);
              var box = Math.round(68 * dpr);
              var bx = Math.round((w - box) / 2);
              var by = Math.round((h - box) / 2 - 18 * dpr);
              var r = Math.round(14 * dpr);
              ctx.fillStyle = emblemHex;
              ctx.beginPath();
              ctx.moveTo(bx + r, by);
              ctx.arcTo(bx + box, by, bx + box, by + box, r);
              ctx.arcTo(bx + box, by + box, bx, by + box, r);
              ctx.arcTo(bx, by + box, bx, by, r);
              ctx.arcTo(bx, by, bx + box, by, r);
              ctx.closePath();
              ctx.fill();
              var link = document.createElement('link');
              link.rel = 'apple-touch-startup-image';
              link.href = canvas.toDataURL('image/png');
              document.head.appendChild(link);
            }
          }
        } catch (_) {}
      })();
    </script>
  </head>

              <path d="M16 11.5V21.2" stroke="var(--splash-spine)" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M9.8 13.8H13.6M9.8 16.3H13.6" stroke="var(--splash-lines)" stroke-width="1.3" stroke-linecap="round"/>
