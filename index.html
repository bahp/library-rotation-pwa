<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Library Rotation</title>
    <meta
      name="description"
      content="A fast, offline-capable mobile-first PWA for families to catalog children's books, manage multiple reader profiles, and organize curated book rotations."
    />
    <meta property="og:title" content="Library Rotation" />
    <meta
      property="og:description"
      content="A fast, offline-capable mobile-first PWA for families to catalog children's books, manage multiple reader profiles, and organize curated book rotations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="lr-theme-color" name="theme-color" content="#FFFDF9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LibRotate" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style id="lr-critical-splash">
      html {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #FFFDF9;
      }
      html.dark {
        background-color: #152226;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #FAF6EE;
        color: #1A2423;
      }
      html.dark body {
        background-color: #0E1618;
        color: #F4EFE6;
      }
      .lr-boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.875rem;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
      }
      .lr-boot-emblem-wrap {
        position: relative;
        width: 4.5rem;
        height: 4.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lr-boot-emblem {
        width: 4.25rem;
        height: 4.25rem;
        border-radius: 1.25rem;
        background-color: #123C42;
        border: 1px solid rgba(94, 211, 218, 0.25);
        box-shadow: 0 12px 26px -8px rgba(18, 60, 66, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: lr-splash-bounce 1.45s cubic-bezier(0.36, 0, 0.66, 1) infinite;
      }
      html.dark .lr-boot-emblem {
        background-color: #1C2D33;
        box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.55);
      }
      .lr-boot-orbit {
        transform-origin: 16px 16px;
        animation: lr-splash-spin 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .lr-boot-shadow {
        width: 2.5rem;
        height: 0.375rem;
        border-radius: 9999px;
        background-color: rgba(18, 60, 66, 0.14);
        margin-top: -0.35rem;
        animation: lr-splash-shadow 1.45s cubic-bezier(0.36, 0, 0.66, 1) infinite;
      }
      html.dark .lr-boot-shadow {
        background-color: rgba(94, 211, 218, 0.16);
      }
      .lr-boot-title {
        font-family: Georgia, serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0.15rem 0 0;
      }
      .lr-boot-sub {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.75rem;
        opacity: 0.72;
        margin: 0;
      }
      @keyframes lr-splash-bounce {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-9px) scale(1.03);
        }
      }
      @keyframes lr-splash-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes lr-splash-shadow {
        0%, 100% {
          transform: scaleX(1);
          opacity: 0.85;
        }
        50% {
          transform: scaleX(0.72);
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lr-boot-emblem,
        .lr-boot-orbit,
        .lr-boot-shadow {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        // 1. Guard against third-party browser extensions (e.g. request interceptors)
        // throwing "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var fetchDesc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (fetchDesc && fetchDesc.configurable && fetchDesc.get && !fetchDesc.set) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = String((event && event.filename) || '');
            var stack = String((event && event.error && event.error.stack) || '');
            if (
              src.indexOf('chrome-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        // 2. Apply saved or system color theme AND exact top-bar theme-color before first paint (zero FOUC / status-bar seam)
        var isDark = false;
        try {
          var saved = localStorage.getItem('lr_theme_pref') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var themeMeta = document.getElementById('lr-theme-color');
          if (themeMeta) {
            themeMeta.setAttribute('content', isDark ? '#152226' : '#FFFDF9');
          }
        } catch (_) {}

        // 3. Synthesize a crisp warm/dark iOS startup image on iPhone/iPad so Home Screen launch never flashes a black buffer
        try {
          if (/iphone|ipad|ipod/i.test(navigator.userAgent || '')) {
            var dpr = Math.min(window.devicePixelRatio || 2, 3);
            var w = Math.round((window.screen.width || 414) * dpr);
            var h = Math.round((window.screen.height || 896) * dpr);
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.fillStyle = isDark ? '#0E1618' : '#FAF6EE';
              ctx.fillRect(0, 0, w, h);
              var box = Math.round(72 * dpr);
              var bx = Math.round((w - box) / 2);
              var by = Math.round((h - box) / 2 - 18 * dpr);
              var r = Math.round(20 * dpr);
              ctx.fillStyle = isDark ? '#1C2D33' : '#123C42';
              ctx.beginPath();
              ctx.moveTo(bx + r, by);
              ctx.arcTo(bx + box, by, bx + box, by + box, r);
              ctx.arcTo(bx + box, by + box, bx, by + box, r);
              ctx.arcTo(bx, by + box, bx, by, r);
              ctx.arcTo(bx, by, bx + box, by, r);
              ctx.closePath();
              ctx.fill();
              var link = document.createElement('link');
              link.rel = 'apple-touch-startup-image';
              link.href = canvas.toDataURL('image/png');
              document.head.appendChild(link);
            }
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF6EE] text-[#1A2423] dark:bg-[#0E1618] dark:text-[#F4EFE6] antialiased selection:bg-[#1F6E75] selection:text-white">
    <div id="app">
      <div data-app-splash="true" role="status" aria-label="Opening Book Rotation" class="lr-boot-splash">
        <div class="lr-boot-emblem-wrap" aria-hidden="true">
          <div class="lr-boot-emblem">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" width="40" height="40">
              <g class="lr-boot-orbit">
                <path d="M8.5 7.5C11.5 4.3 17.2 3.7 21.5 6L23.5 7.2" stroke="#5ED3DA" stroke-width="2.1" stroke-linecap="round"/>
                <path d="M22.4 4.2L24 7.5L20.5 8" stroke="#5ED3DA" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M23.5 24.5C20.5 27.7 14.8 28.3 10.5 26L8.5 24.8" stroke="#E8A849" stroke-width="2.1" stroke-linecap="round"/>
                <path d="M9.6 27.8L8 24.5L11.5 24" stroke="#E8A849" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
              <path d="M16 11.4C13.6 10.1 10.2 10.1 7.5 11V20.8C10.2 20 13.6 20 16 21.3C18.4 20 21.8 20 24.5 20.8V11C21.8 10.1 18.4 10.1 16 11.4Z" fill="#FAF6EE"/>
              <path d="M16 11.5V21.2" stroke="#123C42" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M9.8 13.8H13.6M9.8 16.3H13.6" stroke="#9A5B25" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M18.4 13.8H22.2M18.4 16.3H22.2" stroke="#9A5B25" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="lr-boot-shadow" aria-hidden="true"></div>
        <p class="lr-boot-title">Book Rotation</p>
        <p class="lr-boot-sub">Opening your family shelf…</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
